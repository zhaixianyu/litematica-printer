dependencies {
    def autoImplementation = { Object... args -> useMappings ? modImplementation(*args) : implementation(*args) }
    def autoCompileOnly = { Object... args -> useMappings ? modCompileOnly(*args) : compileOnly(*args) }
    //拼音
    implementation include("com.belerweb:pinyin4j:${project.pinyin_version}")

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if(useMappings){
        mappings loom.officialMojangMappings()
    }

    autoImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    autoImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    mod_dependencies.forEach { item ->
        def dependencyNotation = item[0]
        def id = item[1]
        def mode = item[2]
        if (mode == 0) return;
        def idFix = mode != 5 ? "${dependencyNotation}:${project.property("${id}")}" : ""
        if (mode == 1) {
            autoImplementation idFix
        } else if (mode == 10) {
            autoImplementation(idFix) { exclude group: item[3] }
        } else if (mode == 3) {
            modApi idFix
        } else if (mode == 2) {
            autoImplementation include(idFix)
        } else if (mode == 4) {
            autoCompileOnly idFix
        } else if (mode == 45) {
            autoCompileOnly files(dependencyNotation)
        } else if (mode == 5) {
            autoImplementation files(dependencyNotation)
        } else if (mode == 6){
            def file = downloadMod(dependencyNotation, "${project.property("${id}")}")
            if (file == null) return
            autoImplementation files(file)
        }
    }
    // Uncomment the following line to enable the deprecated Fabric API modules.
    // These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

    // modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

    runtimeOnly(project(path: ":fabricWrapper"))
}

def downloadMod(String repo, String version) {
    def libsDir = file('build/libs')
    libsDir.mkdirs()

    // 1. 构造缓存文件名
    def FileName = "${repo.split('/')[1]}"
    // 1. 检查 libs 目录下是否有文件名包含 FileName 的文件
    def existingFile = libsDir.listFiles().find { file ->
        // 不讲武德的mod可能出现大小写不统一的情况
        file.isFile() && file.name.toLowerCase().contains(FileName.toLowerCase())
    }

    // 2. 检查缓存文件是否已存在
    if (existingFile != null) {
        println "缓存命中：${FileName}，跳过下载"
        return existingFile
    }


    def apiUrl = "https://api.github.com/repos/${repo}/releases/tags/${version}"

    def conn = new URL(apiUrl).openConnection() as HttpURLConnection
    conn.setRequestProperty("Accept", "application/vnd.github.v3+json")
    conn.setRequestProperty("User-Agent", "Gradle")

    println(apiUrl)
    def minecraftVersion = "${project.minecraft_version}"
    if (conn.responseCode != 200) {
        return null
    }

    def json = new groovy.json.JsonSlurper().parse(conn.inputStream)
    def assets = json.assets
    // 优先选择文件名包含当前 MC 版本的 jar
    def jarAsset = assets.find {
        it.name.endsWith('.jar') &&
                !it.name.contains('-sources') &&
                it.name.contains(minecraftVersion)
    }

    // 如果找不到匹配版本的，可改为抛出异常或使用第一个非源码 jar
    if (!jarAsset) {
        println "警告：未找到包含 MC 版本" +minecraftVersion+ "的 jar，将使用第一个非源码 jar"
        jarAsset = assets.find { it.name.endsWith('.jar') && !it.name.contains('-sources') }
    }

    if (!jarAsset) throw new GradleException("No jar found")

    def outputFile = new File(libsDir, jarAsset.name)
    if (outputFile.exists()) {
        println "File already exists: ${outputFile.name}, skipping."
        return outputFile
    }

    println "Downloading ${jarAsset.name}..."
    def downloadUrl = jarAsset.browser_download_url
    def downloadConn = new URL(downloadUrl).openConnection() as HttpURLConnection
    downloadConn.setRequestProperty("User-Agent", "Gradle")
    downloadConn.instanceFollowRedirects = true // 自动处理重定向

    downloadConn.inputStream.withStream { input ->
        outputFile.withOutputStream { out ->
            out << input
        }
    }
    println "Downloaded to ${outputFile.absolutePath}"
    return outputFile
}
