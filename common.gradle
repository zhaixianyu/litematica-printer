//跑路测试
/**
 * 检测给定的 Maven 仓库 URL 是否有效（可访问）
 * @param url 仓库基础 URL，例如 'https://maven.fabricmc.net/'
 * @param timeout 连接超时和读取超时（毫秒），默认 5000
 * @return true 如果仓库可访问（HTTP 状态码在 200~399 之间）
 */
boolean isRepositoryAvailable(String url, int timeout = 5000) {
    try {
        URL checkUrl = new URL(url)
        HttpURLConnection connection = (HttpURLConnection) checkUrl.openConnection()
        connection.setRequestMethod("HEAD")  // 只获取头信息，节省流量
        connection.setConnectTimeout(timeout)
        connection.setReadTimeout(timeout)
        connection.setInstanceFollowRedirects(true) // 自动跟随重定向

        int responseCode = connection.getResponseCode()
        // 2xx 或 3xx 状态码通常表示可用
        return responseCode >= 200 && responseCode < 400
    } catch (Exception e) {
        // 连接失败或超时等异常视为不可用
        println "嘻嘻 我跑路了哦 $url - ${e.message}"
        return false
    }
}


