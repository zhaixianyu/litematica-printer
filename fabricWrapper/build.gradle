def getGitCommitCount() {
    try {
        // 使用 ProcessBuilder 执行 git rev-list --count HEAD
        Process process = new ProcessBuilder('git', 'rev-list', '--count', 'HEAD')
                .directory(project.rootDir)  // 设置工作目录为项目根目录
                .redirectErrorStream(true)   // 合并错误输出到标准输出
                .start()

        // 读取命令输出
        def output = new ByteArrayOutputStream()
        process.inputStream.withStream { input ->
            byte[] buffer = new byte[1024]
            int len
            while ((len = input.read(buffer)) != -1) {
                output.write(buffer, 0, len)
            }
        }

        int exitCode = process.waitFor()
        if (exitCode == 0) {
            def count = output.toString(StandardCharsets.UTF_8.name()).trim()
            if (count) return count
        }

        // 如果命令失败（例如空仓库），返回 "0"
        println "警告：Git 命令执行失败（退出码 $exitCode），使用 '0' 作为构建号"
        return "0"
    } catch (Exception e) {
        // Git 未安装或其他异常
        println "警告：无法执行 Git 命令 (${e.message})，使用 'local' 作为构建号"
        return "local"
    }
}

